services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: roamandframe
      POSTGRES_USER: roamandframe
      POSTGRES_PASSWORD: roamandframe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"   # SMTP: the app sends mail here
      - "8025:8025"   # web inbox: you read the mail here
volumes:
  pgdata:
