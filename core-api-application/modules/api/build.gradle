plugins {
	id 'org.springframework.boot'
}

dependencies {
	implementation project(':core-api-application:modules:customer')
	implementation project(':core-api-application:modules:catalog')
	implementation project(':core-api-application:modules:cart')
	implementation project(':core-api-application:modules:checkout')
	implementation project(':core-api-application:modules:order')
	implementation project(':core-api-application:modules:inventory')
	implementation project(':core-api-application:modules:payment')
	implementation project(':core-api-application:modules:shipping')
	implementation project(':core-api-application:modules:notification')

	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'org.postgresql:postgresql'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
}

tasks.named('bootRun') {
	workingDir = rootProject.projectDir
	jvmArgs '-Duser.timezone=UTC'
}
